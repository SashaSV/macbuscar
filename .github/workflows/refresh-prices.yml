name: Refresh prices nightly

# Refreshes Price.price for variants already matched in the DB. Each
# store's refresh() iterates matched variants only, re-uses the same
# sub-family search + scoring flow as the full scraper, and writes
# previous Price.price -> Price.oldPrice (+ PriceHistory). Doesn't touch
# ScrapedProduct or financing columns — those change only on full scrape.
#
# See Scraper/refresh_all.py for the orchestrator and
# Scraper/stores/runner.py refresh_store() for the per-store loop.

on:
  schedule:
    # 02:00 UTC daily. That's 03:00 Madrid in winter (CET, Nov–Mar) and
    # 04:00 in summer (CEST, Mar–Oct). Either way it lands in the low-
    # traffic overnight window for Spanish e-commerce sites. GHA cron
    # has ~10–15 min slop, which is fine for a nightly refresh.
    - cron: '0 2 * * *'
  workflow_dispatch: {}   # also allow manual trigger from Actions UI

# One run at a time. If the previous night's run is still going for some
# reason, skip rather than stack.
concurrency:
  group: refresh-prices
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90   # ~45–60 min expected for all 4 stores

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: Scraper/requirements.txt

      - name: Install Python deps
        working-directory: Scraper
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ubuntu-latest ships Chrome stable pre-installed; webdriver-manager
      # downloads a matching chromedriver at runtime. We just sanity-check
      # the binary is present so failures here are obvious.
      - name: Verify Chrome
        run: google-chrome --version

      - name: Refresh prices
        working-directory: Scraper
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # CI=true triggers headless mode in runner.make_driver() — the
          # GHA runner has no display, so non-headless Chrome would fail.
          CI: 'true'
          # Stream logs in real time so failures are visible mid-run instead
          # of appearing all at once when Python exits.
          PYTHONUNBUFFERED: '1'
        run: python refresh_all.py

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: refresh-logs-${{ github.run_id }}
          path: |
            Scraper/*.log
          retention-days: 14
          if-no-files-found: ignore
